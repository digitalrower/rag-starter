[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-starter"
version = "0.1.0"
requires-python = ">=3.13"
# Keep in sync with requirements.txt manually — no enforcement yet (known gap).
dependencies = [
    "anthropic==0.100.0",
    "chromadb==1.5.9",
    "langfuse==4.6.1",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
# Pragmatic baseline, not full strict mode. Tighten later if desired.

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["scripts/utilities/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# E = pycodestyle errors, F = pyflakes, I = isort, B = bugbear, UP = pyupgrade, W = pycodestyle warnings

[tool.ruff.lint.per-file-ignores]
"evals/runner.py" = ["E402"]
"evals/experiment.py" = ["E402"]
"scripts/seed_langfuse_dataset.py" = ["E402"]
"scripts/benchmark_batch.py" = ["E402"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "mypy==2.1.0",
    "ruff==0.15.14",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]